plugins {
    id "com.gradleup.shadow" version "9.0.0-beta12"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

        mixinConfig "omni-morph-common.mixins.json"
        mixinConfig "omni-morph.mixins.json"
        mixinConfig "figura-common.mixins.json"
    }
}

configurations {
    common
    embeddedAvif
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    mappings loom.officialMojangMappings()

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(include("io.github.llamalad7:mixinextras-forge:0.4.1"))
    
    // Libraries
    include(forgeRuntimeLibrary("com.github.FiguraMC.luaj:luaj-core:$luaj-figura"))
    include(forgeRuntimeLibrary("com.github.FiguraMC.luaj:luaj-jse:$luaj-figura"))
    include(forgeRuntimeLibrary("com.neovisionaries:nv-websocket-client:$nv_websocket"))
    include(forgeRuntimeLibrary("com.google.protobuf:protobuf-java:4.31.1"))
    include(forgeRuntimeLibrary("io.airlift:aircompressor:0.27"))
    include(forgeRuntimeLibrary("io.github.jaredmdobson:concentus:1.0.2"))
    include(forgeRuntimeLibrary("org.gagravarr:vorbis-java-core:0.8"))
    // The lifecycle adapter calls package-private JNI types. Keep that package in one JPMS module.
    forgeRuntimeLibrary("com.github.ustc-zzzz:avif-imageio-native-reader:master-6af2f277a8-1@jar")
    embeddedAvif("com.github.ustc-zzzz:avif-imageio-native-reader:master-6af2f277a8-1@jar") {
        transitive = false
    }
    // Jar-in-jar packaging must list the image readers' transitive runtime libraries explicitly.
    ["imageio-webp", "imageio-core", "imageio-metadata"].each { module ->
        include(forgeRuntimeLibrary("com.twelvemonkeys.imageio:${module}:3.15.0"))
    }
    ["common-lang", "common-io", "common-image"].each { module ->
        include(forgeRuntimeLibrary("com.twelvemonkeys.common:${module}:3.15.0"))
    }

    forge rootProject.selectedLoaderCoordinate

    if (rootProject.run_with_geckolib == "true") {
        modRuntimeOnly("software.bernie.geckolib:geckolib-forge-$geckolib_version")
        forgeRuntimeLibrary(group: 'com.eliotlash.mclib', name: 'mclib', version: "${mclib_version}")
    }
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }
}

processResources {
   Map<String, Object> properties = new HashMap<>()

    properties.put("version", project.jarVersion)
    properties.put("java_version", rootProject.java_version)
    properties.put("minecraft_version", rootProject.minecraft_version)
    properties.put("assets_version", rootProject.assets_version)

    properties.forEach((k, v) -> inputs.property(k, v.toString()))
    filesMatching("META-INF/mods.toml") {
        expand properties
    }
    from(rootProject.file('LICENSE.md')) {
        into 'licenses'
        rename { 'OmniMorph-PolyForm-Noncommercial-1.0.0.txt' }
    }
    from(rootProject.file('CREDITS')) {
        into 'credits'
        rename { 'OmniMorph.txt' }
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    ['utils', 'config', 'entries'].each { bridgePackage ->
        relocate "top.aihmc.omnimorph.${bridgePackage}.forge", "org.figuramc.figura.${bridgePackage}.forge"
    }
    configurations = [project.configurations.shadowCommon, project.configurations.embeddedAvif]
    mergeServiceFiles()
    archiveClassifier.set "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set rootProject.loaderArtifactClassifier
}

jar {
    archiveClassifier.set "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = "${base.archivesName.get()}-${project.name}"
            version = project.version
            artifact(remapJar) {
                builtBy remapJar
                classifier ''
            }
            artifact(sourcesJar) {
                builtBy sourcesJar
                classifier 'sources'
            }
        }
    }
    setupRepositories(repositories)
}

void setupRepositories(RepositoryHandler repositories) {
    if (project.hasProperty("mavenUrl")) {
        repositories.maven {
            name = "figuraMaven"
            url project.mavenUrl
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

configurations.configureEach {
    resolutionStrategy.force("net.sf.jopt-simple:jopt-simple:5.0.4")
}

// From the Forge MDK's buildscript, this is temporary until arch loom does it for us
// Merge the resources and classes into the same directory.
// This is done because java expects modules to be in a single directory.
// And if we have it in multiple we have to do performance intensive hacks like having the UnionFileSystem
// This will eventually be migrated to ForgeGradle so modders don't need to manually do it. But that is later.
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
