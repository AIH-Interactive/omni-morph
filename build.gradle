plugins {
	id "architectury-plugin" version "3.4.164"
	id "dev.architectury.loom" version "1.14.476" apply false
}

def coordinateOverride = providers.gradleProperty('loaderCoordinate').orNull
def defaultLoader = coordinateOverride?.startsWith('net.neoforged:') ? 'neoforge' : 'forge'
def nativeLoader = providers.gradleProperty('nativeLoader').getOrElse(defaultLoader)
if (!(nativeLoader in ['forge', 'neoforge'])) {
    throw new GradleException('nativeLoader must be forge or neoforge for Minecraft 1.20.1')
}
def loaderCoordinates = [forge: "net.minecraftforge:forge:${rootProject.forge_version}",
                         neoforge: 'net.neoforged:forge:1.20.1-47.1.106']
def selectedCoordinate = coordinateOverride ?: loaderCoordinates[nativeLoader]
def expectedGroup = nativeLoader == 'forge' ? 'net.minecraftforge:forge:' : 'net.neoforged:forge:'
if (!selectedCoordinate.startsWith(expectedGroup)) {
    throw new GradleException('nativeLoader and loaderCoordinate select different loader families')
}
rootProject.ext.selectedLoaderCoordinate = selectedCoordinate
rootProject.ext.loaderArtifactClassifier = nativeLoader == 'forge' ? 'minecraftforge-mc' : 'neoforge-mc'

architectury {
	minecraft = rootProject.minecraft_version
}

subprojects {
	apply plugin: "dev.architectury.loom"

	loom {
		silentMojangMappingsLicense()
	}

	repositories {
		maven { url 'https://maven.terraformersmc.com/releases/' }
		maven { url 'https://api.modrinth.com/maven' }
		maven { url 'https://maven.quiltmc.org/repository/release/' }
		maven { url 'https://maven.neoforged.net/releases/' }
		maven {
			name = 'GeckoLib'
			url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
			content {
				includeGroupByRegex("software\\.bernie.*")
				includeGroupByRegex("com\\.geckolib.*")
				includeGroup("com.eliotlash.mclib")
			}
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	}
}

allprojects {
	apply plugin: "java"
	apply plugin: "architectury-plugin"
	apply plugin: "maven-publish"

	java_version = rootProject.java_version
	base.archivesName.set(rootProject.archives_base_name)
	version = rootProject.mod_version + "+" + rootProject.minecraft_version
	group = rootProject.maven_group
	if (project.hasProperty("release")) {
		jarVersion = version
	} else {
		jarVersion = version + "-" + 'git rev-parse --short HEAD'.execute().getText().trim()
	}

	repositories {
		// Add repositories to retrieve artifacts from in here.
		// You should only use this when depending on other mods because
		// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
		// See https://docs.gradle.org/current/userguide/declaring_repositories.html
		// for more information about repositories.
		// This immutable build alias has an upstream POM incorrectly labelled master-SNAPSHOT.
		// The jar is self-contained; restrict artifact-only metadata to this one module.
		exclusiveContent {
			forRepository {
				maven {
					name = 'pinnedAvifReader'
					url = 'https://jitpack.io'
					metadataSources {
						artifact()
					}
				}
			}
			filter {
				includeModule('com.github.ustc-zzzz', 'avif-imageio-native-reader')
			}
		}
		maven { url 'https://jitpack.io' }
	}

	tasks.withType(JavaCompile) {
		options.encoding = "UTF-8"
		options.release = Integer.valueOf(java_version)
	}

	java {
		sourceCompatibility = JavaVersion.toVersion(java_version)
		targetCompatibility = JavaVersion.toVersion(java_version)
		withSourcesJar()
	}
}
