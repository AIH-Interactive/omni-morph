name: Minecraft 26.3 Compat

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build-mod:
    name: Build ${{ matrix.loader }} production JAR
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build production loader JAR
        run: |
          & bash ./gradlew ':${{ matrix.loader }}:remapJar' --no-daemon --console=plain 2>&1 | Tee-Object -FilePath build.log
          $buildExitCode = $LASTEXITCODE
          Get-Content -LiteralPath build.log -Tail 60
          if ($buildExitCode -ne 0) { exit $buildExitCode }
      - name: Select distribution JAR
        run: |
          $artifacts = @(Get-ChildItem -LiteralPath '${{ matrix.loader }}/build/libs' -Filter '*.jar' | Where-Object { $_.Name -notmatch '-(dev|sources|shadow)\.jar$' })
          if ($artifacts.Count -ne 1) { throw "Expected one distribution JAR, found $($artifacts.Count)" }
          New-Item -ItemType Directory -Force -Path build/final | Out-Null
          Copy-Item -LiteralPath $artifacts[0].FullName -Destination build/final
          Get-FileHash -Algorithm SHA256 -LiteralPath $artifacts[0].FullName | Format-List | Out-String | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: OmniMorph-${{ matrix.loader }}-26.3
          path: build/final/*.jar
          archive: false
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-failure-logs-${{ matrix.loader }}
          path: build.log
          retention-days: 14
