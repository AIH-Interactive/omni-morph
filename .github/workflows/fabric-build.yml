name: Fabric 26.1.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fabric-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Minecraft 26.1.2 Fabric
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build Fabric mod
        run: |
          & bash ./gradlew :fabric:build --no-daemon --console=plain 2>&1 | Tee-Object -FilePath build.log
          $buildExitCode = $LASTEXITCODE
          Get-Content -LiteralPath build.log -Tail 40
          if ($buildExitCode -ne 0) { exit $buildExitCode }

      - name: Upload downloadable Fabric JAR
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          path: fabric/build/libs/*-fabric-mc.jar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Add download link to run summary
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          "### Minecraft 26.1.2 / Fabric" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "[Download OmniMorph JAR]($env:ARTIFACT_URL)" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fabric-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
