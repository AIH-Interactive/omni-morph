name: Minecraft 1.20.1 Forge family

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dual-loader-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build-mod:
    name: Java 17 ${{ matrix.loader }} production JAR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: forge
            classifier: minecraftforge-mc
          - loader: neoforge
            classifier: neoforge-mc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          set-default: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build the production JAR
        run: |
          & bash ./gradlew :forge:remapJar -PnativeLoader=${{ matrix.loader }} "-Porg.gradle.java.installations.paths=$env:JAVA_HOME_17_X64" --no-daemon --console=plain 2>&1 | Tee-Object -FilePath build.log
          $buildExitCode = $LASTEXITCODE
          Get-Content -LiteralPath build.log -Tail 40
          if ($buildExitCode -ne 0) { exit $buildExitCode }
      - uses: actions/upload-artifact@v7
        with:
          name: OmniMorph-${{ matrix.loader }}-1.20.1
          path: forge/build/libs/*-${{ matrix.classifier }}.jar
          archive: false
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-mod-failure-logs-${{ matrix.loader }}
          path: build.log
          retention-days: 14
