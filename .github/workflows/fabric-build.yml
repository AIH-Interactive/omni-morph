name: Fabric 26.1.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fabric-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build-mod:
    name: Linux Fabric base and JNI interface
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build the unique base JAR and test interface
        run: |
          & bash ./gradlew stageNativeBase nativePackagingSmokeTest --no-daemon --console=plain 2>&1 | Tee-Object -FilePath build.log
          $buildExitCode = $LASTEXITCODE
          Get-Content -LiteralPath build.log -Tail 40
          if ($buildExitCode -ne 0) { exit $buildExitCode }
      - uses: actions/upload-artifact@v7
        with:
          name: internal-native-base
          path: build/native-base/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: internal-native-interface
          path: build/native-interface/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-mod-failure-logs
          path: build.log
          retention-days: 14

  build-native:
    name: Native ${{ matrix.platform }}
    needs: build-mod
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2025
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: android-aarch64
            runner: ubuntu-24.04
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: macos-aarch64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify PowerShell on the native runner
        run: |
          $PSVersionTable | Out-String | Write-Output
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'PowerShell 7 is required on every native runner.' }
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v8
        with:
          name: internal-native-interface
          path: build/native-interface
      - name: Install pinned Android NDK and native CPU emulator
        if: matrix.platform == 'android-aarch64'
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;28.2.13676358' 2>&1 | Tee-Object -FilePath build.log
          $buildExitCode = $LASTEXITCODE
          Get-Content -LiteralPath build.log -Tail 40
          if ($buildExitCode -ne 0) { exit $buildExitCode }
          & sudo apt-get update 2>&1 | Tee-Object -FilePath build.log -Append
          $buildExitCode = $LASTEXITCODE
          Get-Content -LiteralPath build.log -Tail 40
          if ($buildExitCode -ne 0) { exit $buildExitCode }
          & sudo apt-get install -y --no-install-recommends qemu-user 2>&1 | Tee-Object -FilePath build.log -Append
          $buildExitCode = $LASTEXITCODE
          Get-Content -LiteralPath build.log -Tail 40
          if ($buildExitCode -ne 0) { exit $buildExitCode }
      - name: Build native kernels and run platform validation
        run: |
          $script = if ('${{ matrix.platform }}' -eq 'android-aarch64') { './tools/build-native-android-ci.ps1' } else { './tools/build-native-ci.ps1' }
          $arguments = if ('${{ matrix.platform }}' -eq 'android-aarch64') { @() } else { @('-Platform', '${{ matrix.platform }}') }
          & $script @arguments 2>&1 | Tee-Object -FilePath build.log
          $buildExitCode = $LASTEXITCODE
          Get-Content -LiteralPath build.log -Tail 40
          if ($buildExitCode -ne 0) { exit $buildExitCode }
      - uses: actions/upload-artifact@v7
        with:
          name: internal-native-${{ matrix.platform }}
          path: build/native-artifact/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-logs-${{ matrix.platform }}
          path: |
            build.log
            build/native/**/build.log
            build/native/**/*.txt
          if-no-files-found: ignore
          retention-days: 14

  assemble:
    name: Assemble the complete native JAR
    needs: [build-mod, build-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/download-artifact@v8
        with:
          name: internal-native-base
          path: build/native-base
      - uses: actions/download-artifact@v8
        with:
          pattern: internal-native-*-*
          path: build/native-inputs
      - name: Verify all six platforms, commit/run, ABI, hashes, notices and unchanged base entries
        run: |
          & bash ./gradlew assembleNativeJar '-PnativeBaseDir=build/native-base' '-PnativeArtifactsDir=build/native-inputs' '-PnativeOutput=build/final/omni-morph-1.0.0-alpha.1+26.1.2-fabric-mc.jar' "-PnativeCommit=$env:GITHUB_SHA" "-PnativeRun=$env:GITHUB_RUN_ID" "-PnativeAttempt=$env:GITHUB_RUN_ATTEMPT" --no-daemon --console=plain 2>&1 | Tee-Object -FilePath build.log
          $buildExitCode = $LASTEXITCODE
          Get-Content -LiteralPath build.log -Tail 40
          if ($buildExitCode -ne 0) { exit $buildExitCode }
          Get-FileHash -Algorithm SHA256 -LiteralPath 'build/final/omni-morph-1.0.0-alpha.1+26.1.2-fabric-mc.jar' | Format-List | Out-String | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: internal-final-native-jar
          path: build/final/*-fabric-mc.jar
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: assemble-failure-logs
          path: build.log
          retention-days: 14

  verify-final:
    name: Final JAR native ${{ matrix.platform }}
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2025
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: android-aarch64
            runner: ubuntu-24.04
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: macos-aarch64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        if: matrix.platform == 'android-aarch64'
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v8
        with:
          name: internal-native-interface
          path: build/native-interface
      - uses: actions/download-artifact@v8
        with:
          name: internal-final-native-jar
          path: build/final
      - name: Load this platform from the identical final JAR and check fallback/access denial
        if: matrix.platform != 'android-aarch64'
        run: |
          $jar = (Get-ChildItem -LiteralPath build/final -Filter '*-fabric-mc.jar').FullName
          $classpath = @('build/native-interface/classes', 'build/native-interface/lib/*', $jar) -join [IO.Path]::PathSeparator
          foreach ($mode in @('fallback', 'deny', 'allow')) {
            $access = if ($mode -eq 'allow') { '--enable-native-access=ALL-UNNAMED' } else { '--illegal-native-access=deny' }
            $arguments = @($access, '-Xcheck:jni', '-cp', $classpath, 'top.aihmc.omnimorph.render.acceleration.NativePlatformSmokeTest')
            if ($mode -ne 'allow') { $arguments += "--$mode" }
            & java @arguments 2>&1 | Tee-Object -FilePath build.log -Append
            $buildExitCode = $LASTEXITCODE
            Get-Content -LiteralPath build.log -Tail 40
            if ($buildExitCode -ne 0) { exit $buildExitCode }
          }
          Get-FileHash -Algorithm SHA256 -LiteralPath $jar | Format-List | Out-String | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Verify Android artifact from the same final JAR
        if: matrix.platform == 'android-aarch64'
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;28.2.13676358' 2>&1 | Tee-Object -FilePath build.log
          $buildExitCode = $LASTEXITCODE
          Get-Content -LiteralPath build.log -Tail 40
          if ($buildExitCode -ne 0) { exit $buildExitCode }
          $jar = (Get-ChildItem -LiteralPath build/final -Filter '*-fabric-mc.jar').FullName
          & pwsh -NoProfile -File ./tools/verify-android-native.ps1 -JarPath $jar -ExpectedCommit $env:GITHUB_SHA -ExpectedRun $env:GITHUB_RUN_ID 2>&1 | Tee-Object -FilePath build.log -Append
          $buildExitCode = $LASTEXITCODE
          Get-Content -LiteralPath build.log -Tail 40
          if ($buildExitCode -ne 0) { exit $buildExitCode }
          'Android arm64-v8a build/ELF/JNI exports validated; device JNI/game MANUAL/PENDING.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Get-FileHash -Algorithm SHA256 -LiteralPath $jar | Format-List | Out-String | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: final-jni-logs-${{ matrix.platform }}
          path: build.log
          retention-days: 14

  publish-artifact:
    name: Downloadable complete Fabric JAR
    needs: verify-final
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: internal-final-native-jar
          path: build/final
      - name: Upload downloadable Fabric JAR
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: OmniMorph-Fabric-26.1.2
          path: build/final/*-fabric-mc.jar
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Add verified download link
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          "### Minecraft 26.1.2 / Fabric — six native builds, five platform JNI checks; Android device JNI/game MANUAL/PENDING" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "[Download OmniMorph JAR]($env:ARTIFACT_URL)" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
