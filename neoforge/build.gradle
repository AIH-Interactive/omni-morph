plugins {
    id "com.gradleup.shadow" version "9.0.0-beta12"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    mappings loom.officialMojangMappings()

    // Libraries
    include(forgeRuntimeLibrary("com.github.FiguraMC.luaj:luaj-core:$luaj-figura"))
    include(forgeRuntimeLibrary("com.github.FiguraMC.luaj:luaj-jse:$luaj-figura"))
    include(forgeRuntimeLibrary("com.neovisionaries:nv-websocket-client:$nv_websocket"))
    include(forgeRuntimeLibrary("com.google.protobuf:protobuf-java:4.31.1"))
    include(forgeRuntimeLibrary("io.airlift:aircompressor:0.27"))
    include(forgeRuntimeLibrary("io.github.jaredmdobson:concentus:1.0.2"))
    include(forgeRuntimeLibrary("org.gagravarr:vorbis-java-core:0.8"))
    include(forgeRuntimeLibrary("com.github.ustc-zzzz:avif-imageio-native-reader:master-6af2f277a8-1@jar"))
    // Jar-in-jar packaging must list the image readers' transitive runtime libraries explicitly.
    ["imageio-webp", "imageio-core", "imageio-metadata"].each { module ->
        include(forgeRuntimeLibrary("com.twelvemonkeys.imageio:${module}:3.15.0"))
    }
    ["common-lang", "common-io", "common-image"].each { module ->
        include(forgeRuntimeLibrary("com.twelvemonkeys.common:${module}:3.15.0"))
    }

    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    if (rootProject.run_with_geckolib == "true") {
        modRuntimeOnly("software.bernie.geckolib:geckolib-neoforge-$geckolib_version")
        forgeRuntimeLibrary(group: 'com.eliotlash.mclib', name: 'mclib', version: "${mclib_version}")
    }

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}

processResources {
    Map<String, Object> properties = new HashMap<>()

    properties.put("version", project.jarVersion)
    properties.put("java_version", rootProject.java_version)
    properties.put("minecraft_version", rootProject.minecraft_version)
    properties.put("assets_version", rootProject.assets_version)

    properties.forEach((k, v) -> inputs.property(k, v.toString()))
    filesMatching("META-INF/neoforge.mods.toml") {
        expand properties
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    // ExpectPlatform derives implementation owners from the retained common namespace.
    ['utils', 'config', 'entries'].each { bridgePackage ->
        relocate "top.aihmc.omnimorph.${bridgePackage}.neoforge", "org.figuramc.figura.${bridgePackage}.neoforge"
    }

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set "dev-shadow"
}

remapJar {
    atAccessWideners.add(loom.accessWidenerPath.get().asFile.name)
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set "neoforge-mc"
}

jar {
    archiveClassifier.set "dev"
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE.md')) {
        into 'licenses'
        rename { 'OmniMorph-PolyForm-Noncommercial-1.0.0.txt' }
    }
    from(rootProject.file('CREDITS')) {
        into 'credits'
        rename { 'OmniMorph.txt' }
    }
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = "${base.archivesName.get()}-${project.name}"
            version = project.version
            artifact(remapJar) {
                builtBy remapJar
                classifier ''
            }
            artifact(sourcesJar) {
                builtBy sourcesJar
                classifier 'sources'
            }
        }
    }
    setupRepositories(repositories)
}

void setupRepositories(RepositoryHandler repositories) {
    if (project.hasProperty("mavenUrl")) {
        repositories.maven {
            name = "figuraMaven"
            url project.mavenUrl
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}
