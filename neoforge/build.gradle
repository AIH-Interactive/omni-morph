plugins {
    id "com.gradleup.shadow" version "9.0.0-beta12"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    // No-remap Loom expects the official namespace even though the class names are identical.
    def commonWidener = project(":common").loom.accessWidenerPath.get().asFile
    def officialWidener = layout.buildDirectory.file('generated/omni-morph.accesswidener').get().asFile
    officialWidener.parentFile.mkdirs()
    officialWidener.setText(commonWidener.getText('UTF-8').replaceFirst('accessWidener v2 named', 'accessWidener v2 official'), 'UTF-8')
    accessWidenerPath = officialWidener
    enableTransitiveAccessWideners = false
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    // Libraries
    include(forgeRuntimeLibrary("com.github.FiguraMC.luaj:luaj-core:$luaj-figura"))
    include(forgeRuntimeLibrary("com.github.FiguraMC.luaj:luaj-jse:$luaj-figura"))
    include(forgeRuntimeLibrary("com.neovisionaries:nv-websocket-client:$nv_websocket"))

    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    if (rootProject.run_with_geckolib == "true") {
        modRuntimeOnly("software.bernie.geckolib:geckolib-neoforge-$geckolib_version")
        forgeRuntimeLibrary(group: 'com.eliotlash.mclib', name: 'mclib', version: "${mclib_version}")
    }

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}

processResources {
    Map<String, Object> properties = new HashMap<>()

    properties.put("version", project.jarVersion)
    properties.put("java_version", rootProject.java_version)
    properties.put("minecraft_version", rootProject.minecraft_version)
    properties.put("assets_version", rootProject.assets_version)

    properties.forEach((k, v) -> inputs.property(k, v.toString()))
    filesMatching("META-INF/neoforge.mods.toml") {
        expand properties
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set "dev-shadow"
}

tasks.register('remapJar', Jar) {
    dependsOn shadowJar
    from { zipTree(shadowJar.archiveFile.get().asFile) }
    archiveClassifier.set "neoforge-mc"
}

jar {
    archiveClassifier.set "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = "${base.archivesName.get()}-${project.name}"
            version = project.version
            artifact(remapJar) {
                builtBy remapJar
                classifier ''
            }
            artifact(sourcesJar) {
                builtBy sourcesJar
                classifier 'sources'
            }
        }
    }
    setupRepositories(repositories)
}

void setupRepositories(RepositoryHandler repositories) {
    if (project.hasProperty("mavenUrl")) {
        repositories.maven {
            name = "figuraMaven"
            url project.mavenUrl
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}
