modLoader = "javafml"
loaderVersion = "[11,)"
issueTrackerURL = "https://github.com/AIH-Interactive/omni-morph/issues"
license = "PolyForm-Noncommercial-1.0.0"
displayURL = "https://github.com/AIH-Interactive/omni-morph"

[[mods]]
modId = "omni_morph"
namespace = "omni-morph"
version = "${version}"
displayName = "OmniMorph"
logoFile="icon.png"
authors = "AIH-Interactive, skyrina, lumelia, UnlikePaladin, omoflop"
credits = "TooManyLimits, Lexize, KitCat962, Manuel-3, superpowers04, auriafoxgirl, applejuiceyy"
description = '''
Unified Figura Avatar and YSM models with linked Lua and Molang runtimes
'''

[modproperties.omni_morph]
assets_version="${assets_version}"

[[dependencies.omni_morph]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},26.1.3)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.omni_morph]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "CLIENT"

[[mixins]]
config = "figura-common.mixins.json"
[[mixins]]
config = "omni-morph-common.mixins.json"
[[mixins]]
config = "omni-morph.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[features.omni_morph]
javaVersion = "[${java_version},)"
