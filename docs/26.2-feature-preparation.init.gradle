    rootProject.tasks.register('native26_2FeaturePreparationSmokeTest', JavaExec) {
        dependsOn compile
        classpath = rootProject.files(output) + common.configurations.compileClasspath + common.configurations.runtimeClasspath
        mainClass = 'top.aihmc.omnimorph.model.rendering.nodeRenderer.NativeFeaturePreparationSmokeTest'
    }
