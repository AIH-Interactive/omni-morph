        source common.files('src/test/java/top/aihmc/omnimorph/model/rendering/nodeRenderer/NativeFeaturePreparationSmokeTest.java',
            'src/main/java/top/aihmc/omnimorph/model/rendering/nodeRenderer/SameFrameFeaturePreparation.java')
        classpath = common.configurations.compileClasspath
        destinationDirectory = output
        options.release = 25
        options.encoding = 'UTF-8'
